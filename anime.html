<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品库 - 制作人员库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8f9fa; }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 0; color: #9ca3af; font-size: 14px; }
    </style>
</head>
<body class="text-gray-800">

    <!-- 顶部导航 (完全和 index.html 保持一致) -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="index.html" class="text-xl font-bold flex items-end gap-2">
                    制作人员库 <span class="text-xs text-gray-400 font-normal mb-1 tracking-widest">STAFF CAST</span>
                </a>
                <nav class="hidden md:flex gap-6 text-sm text-gray-600">
                    <a href="index.html" class="hover:text-gray-900 transition">首页</a>
                    <a href="anime.html" class="font-bold text-gray-900 border-b-2 border-gray-900 pb-1">作品库</a>
                    <span class="text-gray-300 cursor-not-allowed" title="开发中">专题</span>
                    <span class="text-gray-300 cursor-not-allowed" title="开发中">统计</span>
                </nav>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-end mb-8">
            <h1 class="text-2xl font-bold">全部作品</h1>
            <span class="text-sm text-gray-500" id="totalCount">-</span>
        </div>
        
        <!-- 作品网格 -->
        <div id="animeGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <!-- 动态注入区域 -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ 填入你的 Supabase 信息
        const SUPABASE_URL = ''; 
        const SUPABASE_ANON_KEY = ''; 
        let supabase = (SUPABASE_URL && SUPABASE_ANON_KEY) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        async function fetchAnime() {
            const grid = document.getElementById('animeGrid');
            
            if (!supabase) {
                document.getElementById('totalCount').innerText = `共 0 部`;
                grid.innerHTML = `<div class="empty-state md:col-span-4 border-2 border-dashed border-gray-200 rounded-xl">未配置数据库，作品等待录入...</div>`;
                return;
            }

            const { data, error } = await supabase.from('anime').select('*').order('release_year', { ascending: false });
            
            if (error) {
                grid.innerHTML = `<div class="empty-state md:col-span-4 text-red-400">加载失败，请检查配置</div>`;
                return;
            }
            
            document.getElementById('totalCount').innerText = `共 ${data.length} 部`;

            if (data.length === 0) {
                grid.innerHTML = `<div class="empty-state md:col-span-4 border-2 border-dashed border-gray-200 rounded-xl">
                    <svg class="w-16 h-16 mb-4 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                    作品库空空如也，等待录入...
                </div>`;
                return;
            }

            grid.innerHTML = data.map(item => `
                <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-md transition cursor-pointer group">
                    <div class="aspect-[3/4] bg-gray-100 rounded-lg mb-4 flex items-center justify-center text-gray-300 overflow-hidden">
                        <svg class="w-10 h-10 group-hover:scale-110 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    </div>
                    <h3 class="font-bold text-gray-800 truncate" title="${item.title}">${item.title}</h3>
                    <p class="text-xs text-gray-500 mt-1">${item.release_year ? item.release_year + '年' : '年份待补充'}</p>
                </div>
            `).join('');
        }
        fetchAnime();
    </script>
</body>
</html>
