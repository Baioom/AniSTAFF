<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="日本动画制作人员查询表：萌娘百科OP表记数据，作品按TV动画、剧场版、OVA分类，支持按时间与首字母排序。">
<title>动画制作人员查询表 - AniStaff</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-logo">動</span>
      <div class="brand-text">
        <h1>动画制作人员查询表</h1>
        <p class="brand-sub">日本TV动画OP表记 · 萌娘百科 × Weblio</p>
      </div>
    </div>
    <nav class="tabs" id="mainTabs">
      <button class="tab active" data-view="staff">人员查询</button>
      <button class="tab" data-view="works">作品库</button>
    </nav>
  </div>
</header>

<main id="app">

  <!-- ============ 人员查询 ============ -->
  <section id="view-staff" class="view active">
    <div class="controls">
      <div class="searchbox">
        <input type="search" id="staffSearch" placeholder="搜索制作人员姓名（中文名 / 日文名 / 拼音）" autocomplete="off">
        <button id="staffSearchClear" class="clear-btn" title="清空">×</button>
      </div>
      <div class="sortgroup">
        <span class="sort-label">人员排序</span>
        <button class="chip active" data-staffsort="pinyin">首字母</button>
        <button class="chip" data-staffsort="count">作品数</button>
      </div>
    </div>
    <div class="azbar" id="azbar"></div>
    <div class="staff-layout">
      <div class="staff-list" id="staffList"></div>
      <aside class="staff-detail" id="staffDetail">
        <div class="detail-empty">← 点击左侧人员查看其作品</div>
      </aside>
    </div>
  </section>

  <!-- ============ 作品库 ============ -->
  <section id="view-works" class="view">
    <div class="controls">
      <div class="typegroup" id="workTypeTabs">
        <button class="chip active" data-type="tv">TV动画</button>
        <button class="chip" data-type="movie">剧场版</button>
        <button class="chip" data-type="ova">OVA</button>
      </div>
      <div class="searchbox grow">
        <input type="search" id="workSearch" placeholder="搜索作品名称" autocomplete="off">
        <button id="workSearchClear" class="clear-btn" title="清空">×</button>
      </div>
      <div class="sortgroup">
        <span class="sort-label">作品排序</span>
        <button class="chip active" data-worksort="time">时间</button>
        <button class="chip" data-worksort="letter">首字母</button>
        <button class="chip" id="workOrderToggle" title="切换升序/降序">↓ 降序</button>
      </div>
    </div>
    <div class="works-meta" id="worksMeta"></div>
    <div class="works-list" id="worksList"></div>
  </section>

</main>

<footer class="footer">
  <div class="footer-inner">
    <p>数据来源：
      <a href="https://mzh.moegirl.org.cn/User:%E9%BB%91%E9%BB%91%E7%9A%84%E7%99%BD%E6%8F%8F/%E6%97%A5%E6%9C%ACTV%E5%8A%A8%E7%94%BBOP%E8%A1%A8%E8%AE%B0" target="_blank" rel="noopener">萌娘百科 · 日本TV动画OP表记</a>（制作人员与TV动画作品）·
      <a href="https://www.weblio.jp/content/%E6%97%A5%E6%9C%AC%E3%81%AE%E3%83%86%E3%83%AC%E3%83%93%E3%82%A2%E3%83%8B%E3%83%A1%E4%BD%9C%E5%93%81%E4%B8%80%E8%A6%A7" target="_blank" rel="noopener">Weblio 日本のテレビアニメ作品一覧</a> ·
      <a href="https://www.weblio.jp/content/%E6%97%A5%E6%9C%AC%E3%81%AE%E3%82%A2%E3%83%8B%E3%83%A1%E6%98%A0%E7%94%BB%E4%BD%9C%E5%93%81%E4%B8%80%E8%A6%A7" target="_blank" rel="noopener">日本のアニメ映画作品一覧</a> ·
      <a href="https://www.weblio.jp/content/%E6%97%A5%E6%9C%AC%E3%81%AEOVA%E4%BD%9C%E5%93%81%E4%B8%80%E8%A6%A7" target="_blank" rel="noopener">日本のOVA作品一覧</a>
      （Weblio 内容源自维基百科镜像）
    </p>
    <p id="footerMeta"></p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
